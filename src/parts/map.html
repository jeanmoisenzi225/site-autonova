{{#map}}<a class="map" data-link="map" aria-label="Plan d'accès : ouvrir l'itinéraire vers le garage">{{#map.photo}}<img class="map-photo" src="{{url}}" alt="{{alt}}" loading="lazy">{{/map.photo}}{{#map.tiles.length}}<span class="map-tiles" style="left: calc(50% - {{map.px}}px); top: calc(50% - {{map.py}}px)">{{#map.tiles}}<img src="{{src}}" alt="" width="256" height="256" style="left: {{left}}px; top: {{top}}px" loading="lazy">{{/map.tiles}}</span><span class="map-pin" aria-hidden="true"></span><span class="map-credit">© les contributeurs d'OpenStreetMap</span>{{/map.tiles.length}}</a>{{/map}}
